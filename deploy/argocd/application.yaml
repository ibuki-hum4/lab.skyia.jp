# ArgoCD の Application の例。ArgoCD が入っているクラスターに、自分で適用して使う。
#   kubectl apply -n argocd -f deploy/argocd/application.yaml
# 先に deploy/k8s の REPLACE_ME を埋めておくこと。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab
  namespace: argocd # ArgoCD を入れた Namespace
spec:
  project: default
  source:
    repoURL: https://github.com/ibuki-hum4/lab.skyia.jp.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: lab
  syncPolicy:
    # 慣れるまでは手で Sync する。自動にするなら、下のコメントを外す
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true

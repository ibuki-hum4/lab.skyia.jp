# 封をする前の平文の見本。**値は入れずに、この形だけを Git に置く。**
#
#   cp deploy/secret.example.yaml deploy/secret.yaml   # secret.yaml は .gitignore 済み
#   (secret.yaml に値を書く)
#   kubeseal --cert deploy/cert.pem -f deploy/secret.yaml -o yaml > deploy/sealed-secret.yaml
#
# kustomization.yaml の resources には入れない。
apiVersion: v1
kind: Secret
metadata:
  name: lab-secrets
  namespace: lab
type: Opaque
stringData:
  # POSTGRES_PASSWORD と DATABASE_URL のパスワードは**同じ値に揃える**(片方だけ変えるとつながらない)
  POSTGRES_PASSWORD: ""
  DATABASE_URL: "postgresql://lab:<POSTGRES_PASSWORD>@postgres:5432/lab"
  # `openssl rand -base64 32` などで作る。変えると全員のセッションが切れる
  BETTER_AUTH_SECRET: ""
  # HoshID にアプリを登録したときの client_secret
  HOSHID_CLIENT_SECRET: ""

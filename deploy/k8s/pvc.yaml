# SQLite(/data/lab.db)の置き場所
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-data
spec:
  accessModes:
    - ReadWriteOnce # 1 つの Node からだけ書く(レプリカは 1)
  # REPLACE_ME: クラスターの StorageClass の名前(`kubectl get storageclass` で見られる)。
  #   この行を消すと、クラスターの既定の StorageClass を使う。
  storageClassName: REPLACE_ME-storage-class
  resources:
    requests:
      storage: 1Gi

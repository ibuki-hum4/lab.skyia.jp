apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
  annotations:
    # REPLACE_ME: cert-manager の Issuer の名前。
    #   ClusterIssuer なら cert-manager.io/cluster-issuer、Namespace の Issuer なら cert-manager.io/issuer にする。
    #   cert-manager を使わないなら、この注釈と下の tls を消す。
    cert-manager.io/cluster-issuer: REPLACE_ME-issuer
spec:
  # REPLACE_ME: Ingress のクラス(`kubectl get ingressclass` で見られる。例: nginx、traefik)。
  #   クラスを変えたら、deployment.yaml の TRUST_PROXY_HOPS も、その Ingress の段数に合わせる。
  ingressClassName: REPLACE_ME-ingress-class
  tls:
    - hosts:
        - lab.skyia.jp
      secretName: lab-tls # cert-manager が作る
  rules:
    - host: lab.skyia.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab
                port:
                  name: http

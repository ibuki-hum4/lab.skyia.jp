# SQLite（/data/lab.db）の置き場所。
#
# **PR2 で PostgreSQL に移したら消す。** それまでの仮のもの。
#
# StorageClass は指定しない（クラスタの既定を使う）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-data
  namespace: lab
spec:
  accessModes:
    - ReadWriteOnce # 1 つの Node からだけ書く（replicas は 1）
  resources:
    requests:
      storage: 1Gi

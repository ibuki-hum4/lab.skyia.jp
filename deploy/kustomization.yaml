# lab.skyia.jp のマニフェスト。`kubectl kustomize deploy` で中身を確かめられる。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lab

resources:
  - namespace.yaml
  - configmap.yaml
  # 封をしたもの。**secret.yaml(平文)は絶対に入れない。**
  - sealed-secret.yaml
  - postgres.yaml
  - backup-cronjob.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# **ここは ArgoCD Image Updater が書き換える。** 最新の vX.Y.Z を見つけると
# Git に commit する（設定は argocd-application.yaml の annotation）。
#
# 手で変えてもよいが、その場合も vX.Y.Z を指すこと。ブランチ名や latest を
# 指すと、同じタグの中身が入れ替わって追えなくなる。
#
# アプリと migrator は必ず同じタグ。ずれると、まだない列を前提にした
# コードが動く。CI は両方に同じタグを付けて push する。
images:
  - name: ghcr.io/ibuki-hum4/lab.skyia.jp
    newTag: v0.3.0
  - name: ghcr.io/ibuki-hum4/lab.skyia.jp-migrator
    newTag: v0.3.0

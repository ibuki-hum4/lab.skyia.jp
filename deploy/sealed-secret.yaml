# **プレースホルダー。** このままでは開けない(封をした値ではない)。
#
# secret.example.yaml を secret.yaml(.gitignore 済み)に写して平文を書き、封をしてこのファイルを置き換える:
#
#   kubeseal --cert deploy/cert.pem -f deploy/secret.yaml -o yaml > deploy/sealed-secret.yaml
#
# cert.pem は HoshID と同じクラスタの Sealed Secrets の公開鍵(HoshID の k8s/cert.pem と同じもの)。
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lab-secrets
  namespace: lab
spec:
  encryptedData:
    POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    DATABASE_URL: REPLACE_WITH_KUBESEAL_OUTPUT
    BETTER_AUTH_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    HOSHID_CLIENT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: lab-secrets
      namespace: lab
    type: Opaque

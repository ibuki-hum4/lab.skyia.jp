apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab
  namespace: lab
spec:
  # **SQLite なので 1 つだけ。** 2 つの Pod から同じファイルに書くと壊れる。
  replicas: 1
  # 古い Pod を止めてから新しい Pod を立てる。RWO の PVC は 2 つの Pod から
  # 同時につなげないので、RollingUpdate だと新しい Pod が起動できずに止まる。
  # 更新のときに数秒止まるのは受け入れる（PR2 で PostgreSQL に移したら戻す）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lab
  template:
    metadata:
      labels:
        app: lab
    spec:
      securityContext:
        runAsNonRoot: true
        # 数値で指定する。名前だと kubelet が解決できず起動しない。
        # イメージの bun ユーザー（oven/bun の uid/gid 1000）。
        runAsUser: 1000
        runAsGroup: 1000
        # PVC の中に bun ユーザーが書けるようにする（HoshID のアプリは PVC を
        # 持たないので、ここだけ HoshID と違う）。
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # タグは kustomization.yaml の images で差し替わる。
          # 本番が追うのは vX.Y.Z（中身が入れ替わらないタグ）。
          image: ghcr.io/ibuki-hum4/lab.skyia.jp:v0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3927

          envFrom:
            - configMapRef:
                name: lab-config

          # 起動時に content/ の Markdown を全部 HTML にする（shiki の読み込みが
          # 重い）。startup probe で余裕を持たせる。
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10

          # liveness は DB を見ない方が安全。DB が落ちただけで Pod が
          # 再起動を繰り返しても何も直らない。TCP で生死だけ見る。
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # SQLite。PR2 で消す。
            - name: data
              mountPath: /data
            # ルートを読み取り専用にしているので、一時ファイルの書き場所を与える。
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lab-data
        - name: tmp
          emptyDir: {}

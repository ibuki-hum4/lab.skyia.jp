apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab
  namespace: lab
  annotations:
    # マイグレーション(wave 1)が終わってから起動する。
    argocd.argoproj.io/sync-wave: "2"
spec:
  # 1 つのまま。いいねの連打の制限(rateLimit)は Pod のメモリーで数えるので、
  # 増やすとその分だけ制限がゆるくなる。セッションは DB にあるので、増やしても切れない。
  replicas: 1
  # DB に移ったので、新しい Pod が立ってから古い Pod を止める(止まらずに入れ替わる)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lab
  template:
    metadata:
      labels:
        app: lab
    spec:
      securityContext:
        runAsNonRoot: true
        # 数値で指定する。名前だと kubelet が解決できず起動しない。
        # イメージの bun ユーザー（oven/bun の uid/gid 1000）。
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # タグは kustomization.yaml の images で差し替わる。
          # 本番が追うのは vX.Y.Z（中身が入れ替わらないタグ）。
          image: ghcr.io/ibuki-hum4/lab.skyia.jp:v0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3927

          envFrom:
            - configMapRef:
                name: lab-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lab-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: lab-secrets
                  key: BETTER_AUTH_SECRET
            - name: HOSHID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lab-secrets
                  key: HOSHID_CLIENT_SECRET

          # 起動時に content/ の Markdown を全部 HTML にする（shiki の読み込みが
          # 重い）。startup probe で余裕を持たせる。
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10

          # liveness は DB を見ない方が安全。DB が落ちただけで Pod が
          # 再起動を繰り返しても何も直らない。TCP で生死だけ見る。
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # ルートを読み取り専用にしているので、一時ファイルの書き場所を与える。
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

# コンテナイメージのビルドと公開。
#
# 公開先は GitHub Container Registry（ghcr.io）。GITHUB_TOKEN で押せるので
# 追加の Secret が要らない。
#
# タグの付け方（HoshID の image.yml と同じ）:
#   sha-<短いコミットSHA>  常に付く。動作確認用
#   vX.Y.Z                 そのタグを打ったときだけ付く。**本番が追うのはこれ**
#
# **中身が入れ替わるタグは作らない。** ブランチ名や latest を付けると、同じ
# タグが別のイメージを指すようになり、いつのものが動いているか追えなくなる。
# vX.Y.Z は一度きりなので、本番から指して問題ない。
#
# 本番へ出すとき:
#   git tag v0.1.0 && git push origin v0.1.0
# これで CI が走り、ArgoCD Image Updater が最新の vX.Y.Z を拾って
# deploy/kustomization.yaml を書き換える（deploy/argocd-application.yaml）。
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

# IMAGE_BASE はここで決められない。**Docker はリポジトリ名に大文字を許さず**、
# github.repository は元の綴りで来る。Actions に小文字化の式が無いので、
# 最初のステップで作って GITHUB_ENV へ渡す。

jobs:
  build:
    name: ビルドと公開
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: タグを決める
        id: meta
        run: |
          set -eu

          echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

          # **付けるのは vX.Y.Z だけ。** ブランチ名のタグは中身が入れ替わる
          # ので付けない。
          VERSION_TAG=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              v[0-9]*.[0-9]*.[0-9]*) VERSION_TAG="${GITHUB_REF_NAME}" ;;
              *) echo "::error::vX.Y.Z の形ではないタグです: ${GITHUB_REF_NAME}"; exit 1 ;;
            esac
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      # PR ではビルドが通ることだけを確かめ、公開はしない。
      - name: ghcr.io にログイン
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: イメージをビルド
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 本番の securityContext と同じ縛り（uid 1000、ルートは読み取り専用、
      # capabilities なし、書けるのは /tmp と /data だけ）で立ち上げ、
      # /healthz が 200 を返すことを確かめる。
      - name: 起動できることを確かめる
        run: |
          set -eu
          docker run -d --name smoke -p 3927:3927 \
            --user 1000:1000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /data:uid=1000,gid=1000 \
            -e TRUSTED_PROXIES=10.1.0.0/16 \
            "${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.sha_tag }}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3927/healthz; then echo; docker rm -f smoke; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: 公開する
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          VERSION_TAG="${{ steps.meta.outputs.version_tag }}"
          IMAGE="${{ env.IMAGE_BASE }}"

          docker push "${IMAGE}:${SHA_TAG}"
          if [ -n "${VERSION_TAG}" ]; then
            docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:${VERSION_TAG}"
            docker push "${IMAGE}:${VERSION_TAG}"
          fi

      - name: ArgoCD に指定するタグ
        if: github.event_name != 'pull_request'
        run: |
          echo "### イメージ" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.meta.outputs.version_tag }}" ]; then
            echo "${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.version_tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

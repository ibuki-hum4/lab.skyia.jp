# コンテナイメージのビルドと公開。
#
# 公開先は GitHub Container Registry（ghcr.io）。GITHUB_TOKEN で押せるので
# 追加の Secret が要らない。
#
# タグの付け方（HoshID の image.yml と同じ）:
#   sha-<短いコミットSHA>  常に付く。動作確認用
#   vX.Y.Z                 そのタグを打ったときだけ付く。**本番が追うのはこれ**
#
# **中身が入れ替わるタグは作らない。** ブランチ名や latest を付けると、同じ
# タグが別のイメージを指すようになり、いつのものが動いているか追えなくなる。
# vX.Y.Z は一度きりなので、本番から指して問題ない。
#
# 本番へ出すとき:
#   git tag v0.1.0 && git push origin v0.1.0
# これで CI が走り、ArgoCD Image Updater が最新の vX.Y.Z を拾って
# deploy/kustomization.yaml を書き換える（deploy/argocd-application.yaml）。
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

# IMAGE_BASE はここで決められない。**Docker はリポジトリ名に大文字を許さず**、
# github.repository は元の綴りで来る。Actions に小文字化の式が無いので、
# 最初のステップで作って GITHUB_ENV へ渡す。

jobs:
  build:
    name: ビルドと公開
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: タグを決める
        id: meta
        run: |
          set -eu

          echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

          # **付けるのは vX.Y.Z だけ。** ブランチ名のタグは中身が入れ替わる
          # ので付けない。
          VERSION_TAG=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              v[0-9]*.[0-9]*.[0-9]*) VERSION_TAG="${GITHUB_REF_NAME}" ;;
              *) echo "::error::vX.Y.Z の形ではないタグです: ${GITHUB_REF_NAME}"; exit 1 ;;
            esac
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      # PR ではビルドが通ることだけを確かめ、公開はしない。
      - name: ghcr.io にログイン
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2 つのイメージ(アプリと migrator)を、同じ Dockerfile の別の target から作る
      - name: イメージをビルド(アプリ)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          push: false
          tags: ${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: イメージをビルド(migrator)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          load: true
          push: false
          tags: ${{ env.IMAGE_BASE }}-migrator:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha

      # ニセの HoshID(server/scripts/fake-oidc.ts)を runner の上で立てる。/auth/login の確認に使う
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile

      # 本番と同じ縛り(uid 1000、ルートは読み取り専用、capabilities なし、書けるのは /tmp だけ)で、
      # migrator でマイグレーションを当て、アプリを立ち上げて /healthz・/api/me・/auth/login が返ることを確かめる。
      # ニセの HoshID(127.0.0.1:9999)に届くように、コンテナは host のネットワークで動かす。
      - name: 起動できることを確かめる
        run: |
          set -eu
          bun server/scripts/fake-oidc.ts > fake-oidc.log 2>&1 &
          docker run -d --name db -p 127.0.0.1:5432:5432 -e POSTGRES_DB=lab -e POSTGRES_USER=lab -e POSTGRES_PASSWORD=lab postgres:17-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U lab -d lab && break; sleep 1; done
          URL=postgres://lab:lab@127.0.0.1:5432/lab
          docker run --rm --network host --user 1000:1000 --read-only --tmpfs /tmp --cap-drop ALL -e DATABASE_URL=$URL "${{ env.IMAGE_BASE }}-migrator:${{ steps.meta.outputs.sha_tag }}"
          docker run -d --name smoke --network host --user 1000:1000 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp -e DATABASE_URL=$URL -e LAB_BASE_URL=http://127.0.0.1:3927 -e BETTER_AUTH_SECRET=smoke-test-only-0123456789abcdefghijklmnop -e TRUSTED_PROXIES=10.1.0.0/16 -e HOSHID_ISSUER=http://127.0.0.1:9999 -e HOSHID_CLIENT_ID=lab-dev -e HOSHID_CLIENT_SECRET=lab-dev-secret "${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.sha_tag }}"

          fail() { echo "::error::$1"; docker logs smoke; cat fake-oidc.log; exit 1; }
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3927/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3927/healthz >/dev/null || fail "/healthz が返りません"
          test "$(curl -fsS http://127.0.0.1:3927/api/me)" = "null" || fail "/api/me が null を返しません"

          # /auth/login は、HoshID の認可エンドポイントへの 302 になる(Better Auth と、その依存を読み込む道)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3927/auth/login?next=%2F')
          LOCATION=$(curl -s -o /dev/null -w '%{redirect_url}' 'http://127.0.0.1:3927/auth/login?next=%2F')
          echo "/auth/login: $CODE → $LOCATION"
          test "$CODE" = "302" || fail "/auth/login が 302 ではありません: $CODE"
          case "$LOCATION" in
            http://127.0.0.1:9999/authorize\?*) ;;
            *) fail "/auth/login の行き先が HoshID ではありません: $LOCATION" ;;
          esac

          # 落ちていないこと(EROFS などでプロセスが死ぬと、ここで分かる)
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = "true" || fail "アプリが止まりました"
          curl -fsS http://127.0.0.1:3927/healthz >/dev/null || fail "/auth/login のあと /healthz が返りません"
          if docker logs smoke 2>&1 | grep -E 'EROFS|unable to write files'; then fail "読み取り専用のルートに書こうとしました"; fi
          echo "ok"

      - name: 公開する
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          VERSION_TAG="${{ steps.meta.outputs.version_tag }}"

          # **2 つのイメージには必ず同じタグを付ける。** ずれると、まだない列を前提にしたコードが動く
          for suffix in "" "-migrator"; do
            IMAGE="${{ env.IMAGE_BASE }}${suffix}"
            docker push "${IMAGE}:${SHA_TAG}"
            if [ -n "${VERSION_TAG}" ]; then
              docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:${VERSION_TAG}"
              docker push "${IMAGE}:${VERSION_TAG}"
            fi
          done

      - name: ArgoCD に指定するタグ
        if: github.event_name != 'pull_request'
        run: |
          echo "### イメージ" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE_BASE }}-migrator:${{ steps.meta.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.meta.outputs.version_tag }}" ]; then
            echo "${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.version_tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
